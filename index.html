<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stillwater">
<meta name="theme-color" content="#0d0f1c">
<title>Stillwater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d0f1c;color:#fff;font-family:Inter,system-ui,sans-serif}
  body.nocursor{cursor:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #fx{pointer-events:none}
  #gl{touch-action:none}
  #ui{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
      padding:18px calc(18px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
      background:linear-gradient(transparent,rgba(0,0,0,.45));transition:opacity .9s}
  #ui.hide{opacity:0;pointer-events:none}
  button,label.btn{font:300 13px Inter,sans-serif;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);
      border-radius:999px;padding:8px 14px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  button.on{background:rgba(255,255,255,.36)}
  #worlds{display:flex;gap:8px;flex-wrap:wrap}
  .sep{width:1px;height:22px;background:rgba(255,255,255,.25);margin:0 4px}
  #status{font-size:12px;opacity:.85;flex-basis:100%;min-height:15px}
  #title{position:fixed;top:28px;left:16px;right:16px;text-align:center;font:italic 400 34px 'Cormorant Garamond',Georgia,serif;
      letter-spacing:.05em;opacity:0;transition:opacity 2.4s;pointer-events:none;text-shadow:0 1px 16px rgba(0,0,0,.35)}
  #title small{display:block;font:300 12px Inter,sans-serif;letter-spacing:.22em;text-transform:uppercase;opacity:.75;margin-top:8px}
  #preview{position:fixed;top:16px;right:16px;width:200px;transform:scaleX(-1);border-radius:10px;opacity:.6;display:none;pointer-events:none}
  #debug{position:fixed;top:16px;left:16px;font:11px/1.5 ui-monospace,monospace;white-space:pre;background:rgba(0,0,0,.45);padding:8px 10px;border-radius:8px;display:none;pointer-events:none}
  #debug.show{display:block}
  input[type=file]{display:none}
  @media (max-width:600px){ #title{font-size:26px} button,label.btn{padding:7px 11px;font-size:12px} .sep{display:none} }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<video id="preview" muted playsinline></video>
<div id="title"></div>
<pre id="debug"></pre>
<div id="ui">
  <div id="worlds"></div>
  <span class="sep"></span>
  <button id="auto">Auto</button>
  <label class="btn">Load album<input id="file" type="file" accept="audio/*" multiple></label>
  <button id="mic">Listen (mic)</button>
  <button id="cam">Camera</button>
  <button id="fs">Fullscreen</button>
  <div id="status">Turn on the camera and raise your hands. Hold still to gather light, move to scatter it.</div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
